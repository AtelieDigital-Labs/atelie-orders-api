[project]
name = "atelie-orders-service-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "pydantic>=2.13.2",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "taskipy>=1.14.1",
]

# --- Configuração do Taskipy ---
[tool.taskipy.tasks]
run = "fastapi dev app/main.py"
lint = "ruff check . && ruff format --check ."
format = "ruff check --fix . && ruff format ."
test = "pytest -v"

# --- Configuração do Ruff ---
[tool.ruff]
line-length = 88
target-version = "py312" 

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.ruff.lint]
select = ["E", "F", "I", "PL", "PT"]